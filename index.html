<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Coach AI</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="theme-color" content="#0f172a">
</head>

<body>

<header class="header">

  <div class="avatar-container">

    <div id="avatar" class="avatar">
      🤖
    </div>

  </div>

  <h1>🇬🇧 English Coach AI</h1>

  <p>
    Impara l'inglese con l'intelligenza artificiale
  </p>

</header>

<nav class="navbar">

  <button onclick="showPage('home')">
    🏠 Home
  </button>

  <button onclick="showPage('chat')">
    🤖 AI Chat
  </button>

  <button onclick="showPage('quiz')">
    🎯 Quiz
  </button>

  <button onclick="showPage('stats')">
    ⭐ XP
  </button>

</nav>

<main>

<section id="home" class="page active">

  <div class="card">
    <h2>Benvenuto 👋</h2>

    <p>
      Allenati ogni giorno con AI,
      quiz ed esercizi vocali.
    </p>
  </div>

</section>

<section id="chat" class="page">

  <div class="card">

    <h2>🤖 Tutor AI</h2>

    <div class="level-selector">

      <label>
        📚 Livello:
      </label>

      <select id="levelSelect">

        <option value="A1">
          A1 Beginner
        </option>

        <option value="A2">
          A2 Elementary
        </option>

        <option value="B1">
          B1 Intermediate
        </option>

        <option value="B2">
          B2 Advanced
        </option>

      </select>

    </div>

    <div id="chatBox"></div>

    <textarea
      id="userInput"
      placeholder="Scrivi in inglese..."
    ></textarea>

    <button onclick="sendMessage()">
      📩 Invia
    </button>

    <button id="micBtn"
            onclick="toggleContinuousConversation()">
      🎤 Conversazione Live
    </button>

  </div>

</section>

<section id="quiz" class="page">

  <div class="card">

    <h2>🎯 Quiz AI</h2>

    <div id="quizContainer">

      <p>
        Premi il pulsante per generare
        un quiz AI.
      </p>

    </div>

    <button onclick="generateQuiz()">
      🚀 Genera Quiz
    </button>

  </div>

</section>

<section id="stats" class="page">

  <div class="card">

    <h2>⭐ Progressi</h2>

    <div class="xp-box">

      <h3>
        XP Totali
      </h3>

      <div id="xpValue">
        0
      </div>

    </div>

    <div class="xp-box">

      <h3>
        Livello
      </h3>

      <div id="levelValue">
        Beginner
      </div>

    </div>

  </div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
